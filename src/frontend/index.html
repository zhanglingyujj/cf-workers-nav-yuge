<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Tab - 我的导航</title>
    <link rel="icon" href="/icon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="theme-color" content="#0D0E10">
    <link rel="preconnect" href="https://api.xinac.net">
    <link rel="dns-prefetch" href="https://api.xinac.net">
    <style>__TAILWIND_CSS_PLACEHOLDER__</style>
    <style>
        .animate-blob {
            will-change: transform;
            backface-visibility: hidden;
            transform-style: preserve-3d;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }

        @media (max-width: 640px) {
            ::-webkit-scrollbar { display: none; }
            * { scrollbar-width: none; /* Firefox */ }
        }
        
        .animate-blob {
            will-change: transform;
            transform: translateZ(0);
        }

        .card {
            will-change: transform, opacity;
        }

        .card.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            border: 2px dashed #6366F1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 50;
            position: relative;
        }

        .edit-mode .card {
            /* touch-action: none; */  
            touch-action: pan-y;
        }

        body.edit-mode .card,
        body.edit-mode .card:hover {
            transform: none !important;
            box-shadow: none !important;
            overflow: visible !important;
        }

        .card-clone-dragging {
            pointer-events: none !important; /* 关键：让触摸穿透克隆体 */
            z-index: 9999 !important;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .dropdown-enter {
            animation: dropdown-in 0.2s ease-out forwards;
        }
        @keyframes dropdown-in {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .overlay-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .overlay-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .dialog-scale-hidden {
            transform: scale(0.95);
            opacity: 0;
        }
        .dialog-scale-visible {
            transform: scale(1);
            opacity: 1;
        }

        .section-anchor {
            scroll-margin-top: 96px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-text-fill-color: #CBD5E1 !important;
            box-shadow: 0 0 0px 1000px #1e293b inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        .card .card-title,
        .card .card-tip {
            text-shadow: 0 1px 2px rgb(0 0 0 / 0.35);
        }

        #custom-tooltip {
            z-index: 100;
            transition: opacity 0.15s ease-in-out;
        }

        /* 返回顶部按钮（Sun-Panel 风格：玻璃底 + 柔光） */
        #back-to-top-btn {
            transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease;
        }
        #back-to-top-btn.backtop-hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }
    </style></head>

<body class="min-h-screen font-sans text-heritage-dark-100 selection:bg-heritage-900 transition-colors duration-300">
    
    <!-- 背景层 -->
<div class="fixed inset-0 -z-10 h-full w-full overflow-hidden bg-[#0D0E10]">
        <div class="absolute inset-0 bg-gradient-to-br from-[#0D0E10] to-[#1A1C1E]"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[800px] h-[800px] bg-heritage-900/20 rounded-full blur-[150px] mix-blend-screen animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-heritage-900/10 rounded-full blur-[120px] mix-blend-screen animate-blob"></div>
        <div id="custom-bg-image" class="absolute inset-0 bg-center bg-cover bg-fixed bg-no-repeat transition-opacity duration-500 opacity-0"></div>
        <div id="bg-mask" class="absolute inset-0 transition-colors duration-300"></div>
    </div>

    <!-- 浮岛：标题 + 命令条 + 设置（宽度与内容区卡片边界对齐） -->
    <div class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 h-12 pl-4 pr-2 w-[calc(100vw-2rem)] sm:w-[calc(100vw-4rem)] lg:w-[calc(100vw-5rem)] max-w-[1200px] rounded-2xl border border-white/10 bg-[#2a2a2a8c] backdrop-blur-2xl shadow-[0_0_15px_2px_rgba(0,0,0,0.25)]">
        <a class="flex items-center gap-2.5 pr-2 flex-shrink-0 group cursor-pointer" href="#" onclick="location.reload()">
            <div class="w-7 h-7 flex items-center justify-center bg-gradient-to-tr from-heritage-400 to-heritage-600 rounded-lg text-heritage-dark-900 shadow-md shadow-black/30 group-hover:scale-105 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            </div>
            <span id="site-title" class="font-bold text-base tracking-wide text-heritage-variant hidden sm:block truncate">我的导航</span>
        </a>
        <div class="w-px h-5 bg-white/10 flex-shrink-0"></div>
        <button id="cmd-trigger" class="flex-1 flex items-center gap-2.5 h-9 pl-3 pr-2 rounded-xl text-heritage-dark-300 hover:text-heritage-outline hover:bg-white/10 transition-all text-sm min-w-0">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="flex-1 text-left truncate">搜索站点、跳转分类…</span>
            <kbd class="hidden lg:block text-xs border border-white/10 rounded-md px-1.5 py-0.5 bg-white/5 font-sans text-heritage-dark-400 flex-shrink-0">Ctrl K</kbd>
        </button>
        <div id="profile-dropdown-wrapper" class="relative flex-shrink-0">
            <button id="profile-menu-toggle" aria-label="设置" class="w-9 h-9 rounded-xl flex items-center justify-center text-heritage-dark-300 hover:bg-white/10 hover:text-white transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
            </button>
            <!-- Dropdown Menu（亮色） -->
            <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-60 bg-white/95 backdrop-blur-xl rounded-xl shadow-xl shadow-black/20 ring-1 ring-zinc-200 overflow-hidden transform origin-top-right transition-all z-50 dropdown-enter">
                <div class="p-2 space-y-1">
                    <!-- Edit Mode -->
                    <button id="edit-mode-btn" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-700 hover:bg-zinc-200 hover:text-zinc-900 transition-colors flex items-center gap-3 font-medium">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        编辑模式
                    </button>

                    <!-- 导入导出 (仅登录显示) -->
                    <div id="data-tools-menu" class="hidden border-t border-zinc-200/80 my-1 pt-1">
                        <button onclick="exportData()" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-700 hover:bg-zinc-200 hover:text-zinc-900 transition-colors flex items-center gap-3">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            导出配置
                        </button>
                        <button id="import-data-btn" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-700 hover:bg-zinc-200 hover:text-zinc-900 transition-colors flex items-center gap-3">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0l-4 4m4-4v12"></path></svg>
                            导入数据
                        </button>
                        <!-- 文件输入框 (隐藏) -->
                        <input type="file" id="import-file-input" accept=".json" class="hidden">
                        <input type="file" id="bookmark-file-input" accept=".html,.htm,.json" class="hidden">
                    </div>

                    <div class="h-px bg-zinc-200/80 mx-1 my-1"></div>

                    <!-- 自定义背景 -->
                    <div id="bg-controls-section" class="hidden">
                        <div class="px-3 py-2 text-xs space-y-2">
                            <div class="space-y-1.5">
                                        <span class="font-semibold text-zinc-500 uppercase tracking-wider">站点标题</span>
                                        <input type="text" id="site-title-input" placeholder="我的导航" class="w-full px-3 py-1.5 rounded-lg bg-zinc-50 border border-zinc-200 text-zinc-800 text-xs outline-none focus:ring-1 focus:ring-zinc-400 focus:border-zinc-400">
                                    </div>
                                    <div class="space-y-1.5">
                                        <span class="font-semibold text-zinc-500 uppercase tracking-wider">自定义背景</span>
                                    </div>
                            <input type="text" id="bg-image-input" placeholder="背景图 URL" class="w-full px-3 py-1.5 rounded-lg bg-zinc-50 border border-zinc-200 text-zinc-800 text-xs outline-none focus:ring-1 focus:ring-zinc-400 focus:border-zinc-400">
                            <div class="flex items-center justify-between pt-1">
                                <span class="text-zinc-500">遮罩强度</span>
                                <span id="bg-opacity-value" class="font-medium text-zinc-700">20%</span>
                            </div>
                            <input type="range" id="bg-opacity-slider" min="0" max="100" value="20" class="w-full h-1.5 bg-zinc-200 rounded-lg appearance-none cursor-pointer accent-zinc-700 [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-zinc-800">
                            <div class="flex items-center justify-between pt-1">
                                <span class="text-zinc-500">模糊程度</span>
                                <span id="bg-blur-value" class="font-medium text-zinc-700">0px</span>
                            </div>
                            <input type="range" id="bg-blur-slider" min="0" max="20" value="0" step="2" class="w-full h-1.5 bg-zinc-200 rounded-lg appearance-none cursor-pointer accent-zinc-700 [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-zinc-800">
                        </div>
                    </div>

                    <div class="h-px bg-zinc-200/80 mx-1 my-1"></div>
                    <button id="login-Btn" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-700 hover:bg-red-50 hover:text-red-600 transition-colors flex items-center gap-3 font-medium">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        登录 / 退出
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 命令面板（亮色） -->
    <div id="cmd-palette" class="fixed inset-0 z-[90] hidden items-start justify-center pt-[14vh] px-4 bg-heritage-dark-900/60 backdrop-blur-sm">
        <div id="cmd-panel" class="w-full max-w-[600px] bg-white/95 backdrop-blur-2xl border border-zinc-200 rounded-2xl shadow-2xl shadow-black/40 overflow-hidden dropdown-enter">
            <div class="flex items-center gap-3 h-14 px-4 border-b border-zinc-200/80">
                <svg class="w-5 h-5 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="cmd-input" autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-zinc-800 text-sm placeholder-zinc-400" placeholder="搜索站点、跳转分类，或输入关键词搜索网页…">
                <kbd class="text-xs border border-zinc-200 rounded-md px-1.5 py-0.5 bg-zinc-100 font-sans text-zinc-500">Esc</kbd>
            </div>
            <div id="cmd-list" class="max-h-[380px] overflow-y-auto p-2"></div>
            <div id="cmd-engines" class="flex items-center gap-1 px-3 py-2 border-t border-zinc-200/80"></div>
        </div>
    </div>

    <!-- 主要内容区 -->
    <main class="pt-28 pb-20 max-w-7xl mx-auto px-4 sm:px-8 lg:px-10 min-h-screen">
        <!-- 添加分类按钮 (仅编辑模式显示) -->
        <div id="add-category-container" class="hidden mt-12 mb-8">
            <button class="w-full py-4 rounded-2xl border-2 border-dashed border-heritage-dark-700 text-heritage-dark-300 hover:border-white/50 hover:text-white hover:bg-heritage-dark-800/50 transition-all flex items-center justify-center gap-2 group">
                <div class="w-8 h-8 rounded-full bg-heritage-dark-800 group-hover:bg-heritage-900/30 flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <span class="font-medium text-lg">新建分类</span>
            </button>
        </div>

        <!-- 内容渲染容器 -->
        <div id="sections-container" class="space-y-12"></div>

        <!-- 返回顶部按钮独立放置（Sun-Panel 风格） -->
        <div class="fixed bottom-3 right-3 z-50">
            <button id="back-to-top-btn" aria-label="返回顶部" class="backtop-hidden w-9 h-9 rounded-lg bg-[#2a2a2a6b] text-white shadow-[0_0_10px_2px_rgba(0,0,0,0.2)] backdrop-blur-sm flex items-center justify-center hover:bg-[#2a2a2a8c] active:scale-95">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14"></path><path d="M12 21V8"></path><path d="M6 13l6-6 6 6"></path></svg>
            </button>
        </div>
        
    </main>

    <!-- 模态框：添加/编辑链接 -->
    <div id="dialog-overlay" class="fixed inset-0 z-[60] bg-heritage-dark-900/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300 overlay-hidden">
        <div id="dialog-box" class="bg-heritage-dark-800 rounded-2xl shadow-2xl w-full max-w-md p-6 transform transition-all duration-300 border border-heritage-dark-700 dialog-scale-hidden">
            <h3 class="text-xl font-bold mb-5 text-heritage-variant flex items-center gap-2">
                <span class="w-1 h-6 bg-white rounded-full"></span>
                编辑信息
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="name-input" class="w-full px-4 py-2.5 rounded-xl bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-2 focus:ring-white/60 focus:border-white/60 outline-none transition-all text-white" placeholder="网站名称">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">地址 <span class="text-red-500">*</span></label>
                    <input type="text" id="url-input" class="w-full px-4 py-2.5 rounded-xl bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-2 focus:ring-white/60 focus:border-white/60 outline-none transition-all text-white" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">描述</label>
                    <input type="text" id="tips-input" class="w-full px-4 py-2.5 rounded-xl bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-2 focus:ring-white/60 focus:border-white/60 outline-none transition-all text-white" placeholder="简短的描述...">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">图标 URL</label>
                    <input type="text" id="icon-input" class="w-full px-4 py-2.5 rounded-xl bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-2 focus:ring-white/60 focus:border-white/60 outline-none transition-all text-white" placeholder="留空自动获取">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">卡片背景色</label>
                    <div class="flex items-center gap-2 flex-wrap">
                        <div id="bg-color-swatches" class="flex gap-1.5"></div>
                        <button type="button" id="bg-color-clear" class="px-2 py-1 rounded-lg text-xs text-heritage-dark-300 hover:bg-heritage-dark-700 border border-heritage-dark-600 transition-colors">默认</button>
                        <input type="text" id="bg-color-input" placeholder="#RRGGBB[AA]" class="w-28 px-2 py-1.5 rounded-lg bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-1 focus:ring-white/60 outline-none text-white text-xs">
                    </div>
                </div>
                
                <!-- Custom Category Dropdown -->
                <div class="relative z-20" id="category-select-wrapper">
                    <label class="block text-xs font-semibold text-heritage-dark-300 mb-1.5 uppercase tracking-wider">分类</label>
                    <input type="hidden" id="category-select-value">
                    <button id="category-select-btn" class="w-full px-4 py-2.5 text-left rounded-xl bg-heritage-dark-800 border border-heritage-dark-600 focus:ring-2 focus:ring-white/60 outline-none transition-all text-white flex items-center justify-between">
                        <span id="category-select-text">请选择分类</span>
                        <svg class="w-4 h-4 text-heritage-dark-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <!-- Dropdown List -->
                    <div id="category-select-menu" class="hidden absolute top-full left-0 mt-2 w-full max-h-48 overflow-y-auto bg-heritage-dark-800 rounded-xl shadow-xl border border-heritage-dark-700 z-50">
                        <!-- Items populated by JS -->
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="private-checkbox" class="w-5 h-5 text-heritage-500 rounded focus:ring-white/60 border-gray-300 bg-gray-100">
                    <label for="private-checkbox" class="text-sm text-heritage-dark-300 font-medium">设为私密链接 (仅登录可见)</label>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button id="dialog-cancel-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-heritage-dark-300 hover:bg-heritage-dark-700 transition-colors">取消</button>
                <button id="dialog-confirm-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-heritage-dark-900 bg-white hover:bg-zinc-200 shadow-lg shadow-black/25 transition-all hover:translate-y-[-1px]">确定</button>
            </div>
        </div>
    </div>

    <!-- 密码弹窗 -->
    <div id="password-dialog-overlay" class="fixed inset-0 z-[70] bg-heritage-dark-900/70 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300 overlay-hidden">
        <div id="password-dialog-box" class="bg-heritage-dark-800 rounded-2xl shadow-2xl p-8 w-full max-w-sm border border-heritage-dark-700 text-center transform transition-all duration-300 dialog-scale-hidden">
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 text-white">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 class="text-xl font-bold mb-2 text-white">身份验证</h3>
            <p class="text-sm text-heritage-dark-300 mb-6">请输入管理员密码以继续操作</p>

            <h3 class="text-lg font-bold mb-3 text-white">确认操作</h3>
            <p id="custom-confirm-message" class="text-heritage-dark-300 mb-6 text-sm"></p>

            </div>
        </div>
    </div>

    <!-- 分类输入弹窗 -->
    <div id="category-dialog" class="fixed inset-0 z-[65] bg-heritage-dark-900/50 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300 overlay-hidden">

                <button id="category-cancel-btn" class="px-4 py-2 text-sm rounded-xl hover:bg-heritage-outline bg-heritage-dark-700 text-heritage-dark-300 font-medium">取消</button>

                    </div>
                    <div class="text-xs text-heritage-dark-300 mt-1">支持浏览器书签 HTML、Sun-Panel JSON，按 URL 去重后追加</div>

                        <svg class="w-4 h-4 text-heritage-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

                    </div>
                    <div class="text-xs text-heritage-dark-300 mt-1">本站导出的 JSON，导入后将替换全部现有数据</div>
                </button>
            </div>
            <div class="flex justify-end">
                <button id="import-chooser-cancel" class="px-4 py-2 text-sm rounded-xl text-heritage-dark-300 hover:bg-heritage-dark-700 transition-colors font-medium">取消</button>
            </div>
        </div>
    </div>

    <div id="loading-mask" class="fixed inset-0 z-[100] bg-heritage-dark-900/90 backdrop-blur-sm hidden flex flex-col items-center justify-center transition-opacity">

            <div class="absolute inset-0 border-4 border-heritage-dark-700 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-white rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p class="mt-4 text-heritage-400 font-medium animate-pulse tracking-wide">加载中...</p>
    </div>

    <!-- Tooltip Container -->
    <div id="custom-tooltip" class="fixed pointer-events-none max-w-xs whitespace-pre-wrap border leading-relaxed tracking-wide backdrop-blur-md rounded-xl px-4 py-2 text-sm transition-opacity duration-150 opacity-0 bg-heritage-dark-800/90 text-heritage-outline border-heritage-dark-700/50">
    </div>
